<!doctype html><html lang="en"><head><script src="/i18n.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf" content="__TOKEN__"><title>保存交易器连接</title><link rel="stylesheet" href="/style.css"><script src="/migration.js" defer></script></head><body><main>
<section class="panel"><h1>保存连接 · 重启后恢复</h1><p>旧 App 仍保持运行。请最后一次填入原连接密钥；通过只读检查后保存到 macOS 钥匙串。页面不回显密钥，重启仍暂停新开仓。ChatGPT 登录缓存继续保留，无需重复登录。</p><p id="storage-status" role="status">正在读取保存状态…</p></section>
<section class="panel"><h2>币安实盘连接</h2><form id="binance" autocomplete="off"><label>原 API Key<input id="key" type="password" required autocomplete="off" maxlength="256"></label><label>原 API Secret<input id="secret" type="password" required autocomplete="off" maxlength="256"></label><button type="submit" class="button primary">只读检查并保存币安连接</button></form><p id="binance-result" role="status"></p></section>
<section class="panel"><h2>模型 API 连接</h2><form id="model-form" autocomplete="off"><label>服务地址<input id="base-url" type="url" value="http://127.0.0.1:8080/v1" required autocomplete="off"></label><label>当前模型<input id="model" value="gpt-6-luna" required autocomplete="off"></label><label>原模型 API Key<input id="api-key" type="password" required autocomplete="off" maxlength="512"></label><p>执行一次小型连接测试，可能消耗模型额度。保存当前 Luna 配置，不更改现有交易策略。</p><button type="submit" class="button primary">测试并保存模型连接</button></form><p id="model-result" role="status"></p></section>
</main></body></html>
